server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Card pictures live outside the image, in a folder the owner mounts at /usr/share/nginx/cards.
  # Only plain picture file names are served; add_header here repeats the server-level headers
  # because nginx does not inherit them once a location sets its own.
  location ~ ^/cards/[a-z0-9-]+\.(webp|jpg|png)$ {
    root /usr/share/nginx;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
